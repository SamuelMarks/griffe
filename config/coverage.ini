[coverage:run]
branch = true
parallel = true
source_pkgs =
  griffe
  griffecli
source =
  packages/griffecli/tests/
  packages/griffelib/tests/

[coverage:paths]
griffelib =
  packages/griffelib/src/griffe
  .venv/lib/*/site-packages/griffe
  .venvs/*/lib/*/site-packages/griffe
griffecli =
  packages/griffecli/src/griffecli
  .venv/lib/*/site-packages/griffecli
  .venvs/*/lib/*/site-packages/griffecli

[coverage:report]
precision = 2
omit =
  packages/*/src/*/__init__.py
  packages/*/src/*/__main__.py
  packages/*/tests/__init__.py
  packages/*/tests/tmp/*
exclude_lines =
  pragma: no cover
  if TYPE_CHECKING

[coverage:json]
output = htmlcov/coverage.json
