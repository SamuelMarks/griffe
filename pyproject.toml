[build-system]
# pdm-backend is left here as a dependency of the version discovery script currently in use.
# It may be removed in the future. See mkdocstrings/griffe#430
requires = ["hatchling", "pdm-backend", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project]
name = "griffe"
description = "Signatures for entire Python programs. Extract the structure, the frame, the skeleton of your project, to generate API documentation or find breaking changes in your API."
authors = [{name = "Timothée Mazzucotelli", email = "dev@pawamoy.fr"}]
license = "ISC"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4",
    "python-cdd>=0.0.99rc46",
]
keywords = ["api", "signature", "breaking-changes", "static-analysis", "dynamic-analysis"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # YORE: EOL 3.11: Remove line.
    "Programming Language :: Python :: 3.11",
    # YORE: EOL 3.12: Remove line.
    "Programming Language :: Python :: 3.12",
    # YORE: EOL 3.13: Remove line.
    "Programming Language :: Python :: 3.13",
    # YORE: EOL 3.14: Remove line.
    "Programming Language :: Python :: 3.14",
    # YORE: EOL 3.15: Remove line.
    "Programming Language :: Python :: 3.15",
    "Topic :: Documentation",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://mkdocstrings.github.io/griffe"
Documentation = "https://mkdocstrings.github.io/griffe"
Changelog = "https://mkdocstrings.github.io/griffe/changelog"
Repository = "https://github.com/mkdocstrings/griffe"
Issues = "https://github.com/mkdocstrings/griffe/issues"
Discussions = "https://github.com/mkdocstrings/griffe/discussions"
Gitter = "https://gitter.im/mkdocstrings/griffe"
Funding = "https://github.com/sponsors/pawamoy"

[project.optional-dependencies]
# The 'faster' extra installs the Rust/Ruff parser accelerator. Griffe automatically falls back to
# CPython's parser when the accelerator is unavailable or an extension needs concrete AST nodes.
faster = ["prune-source>=0.1.6"]
# The 'pypi' extra provides dependencies needed for the load_pypi functionality
# to download and inspect packages from PyPI.
pypi = ["pip>=24.0", "platformdirs>=4.2", "wheel>=0.42"]

[project.scripts]
griffe = "griffecli:main"

[tool.uv-dynamic-versioning]
pattern = '(?P<base>\d+\.\d+\.\d+)'

[tool.hatch.version]
source = "code"
path = "scripts/get_version.py"
expression = "get_version()"

[tool.hatch.build]
# Include as much as possible in the source distribution, to help redistributors.
ignore-vcs = true
exclude = [".github"]

[tool.hatch.build.targets.sdist]
include = [
    "/config",
    "/docs",
    "/packages",
    "/scripts",
    "/share",
    "/tests",
    "/duties.py",
    "/zensical.toml",
    "/*.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
# Manual pages can be included in the wheel.
# Depending on the installation tool, they will be accessible to users.
# pipx supports it, uv does not yet, see https://github.com/astral-sh/uv/issues/4731.
packages = [
    "packages/griffelib/src/griffe",
    "packages/griffecli/src/griffecli",
]
artifacts = ["share/**/*"]

[dependency-groups]
maintain = [
    "git-changelog>=2.5",
    "twine>=5.1",
    "yore>=0.3.3",
]
ci = [
    "duty>=1.9",
    "griffe-inherited-docstrings>=1.1.2",
    "jsonschema>=4.18",
    "pre-commit>=4.0",
    "prune-source>=0.1.6",
    "pysource-codegen>=0.7",
    "pysource-minimize>=0.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-gitconfig>=0.8.0",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.6",
    "ruff>=0.13",
    "ty>=0.0.59",
    "types-markdown>=3.6",
    "types-pyyaml>=6.0",
    "zizmor>=1.0",
]
 docs = [
    "code2flow>=2.5",
    "ghp-import>=2.1",
    "griffe-inherited-docstrings>=1.1.2",
    "markdown-callouts>=0.4",
    "markdown-exec[ansi]>=1.8",
    "mkdocstrings[python]>=0.29",
    "pydeps>=1.12",
    "pymdown-extensions>=10.2,<12",
    "zensical>=0.0.21",
]

[tool.uv]
default-groups = ["maintain", "ci", "docs"]
workspace = { members = ["packages/*"] }

[tool.uv.sources]
griffelib = { workspace = true }
griffecli = { workspace = true }
